/* NOITE NO CASARÃO — EXPLORAÇÃO E TELAS CINEMATOGRÁFICAS (INTERFACE CONSTRUÍDA EM CSS/SVG) */
:root{--velvet:#250e0e;--gild:#d4aa6b;--edgebright:#a3733d;--ivory:#ead1a8;--inkdark:#120c0b}
body[data-visual="noir"]{--velvet:#241912;--gild:#d5b384;--edgebright:#ab875e;--ivory:#f3dfb7}
body[data-visual="steel"]{--velvet:#101b26;--gild:#9fbccc;--edgebright:#627f91;--ivory:#e0e6e9}
body[data-visual="violet"]{--velvet:#1e1328;--gild:#c3a0dc;--edgebright:#795b96;--ivory:#ebdef5}
.game{background:radial-gradient(ellipse at 80% 12%,#090c1370,transparent 35%)}
.brand{font-family:Georgia,serif;font-weight:400;letter-spacing:.115em;line-height:1.12;color:var(--ivory);text-shadow:0 3px 1px #000,0 0 28px #a76d3b70}
.brand:after{content:'❧ ───────── ✦ ───────── ❧';display:block;font-size:11px;letter-spacing:.13em;color:var(--gild);margin:9px 0 0;text-shadow:0 0 9px #b27a47}
.frame{border-color:var(--edgebright);box-shadow:inset 0 0 0 1px #3d281b,inset 0 0 0 3px #80603f,0 12px 38px #000c,0 0 0 1px #040404}
.center,.inventory,.cast,.meters,.menu{background:linear-gradient(148deg,#180d0de8,#08090beF 49%,#1c0e0eee);backdrop-filter:blur(3px)}
.menu{gap:10px;display:flex;flex-direction:column;padding:8px}
.menu button{height:auto;min-height:56px;flex:1;max-height:none;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;padding:8px 2px;background:radial-gradient(ellipse at 55% 5%,#4b2520,#180d0f 70%);border:1px solid var(--edgebright);border-radius:6px;color:var(--ivory);box-shadow:inset 0 0 0 2px #13090b,0 4px 7px #000a}
.menu button .menu-ico{font-size:clamp(21px,2.4vw,32px)}.menu button .menu-name{font:10px Georgia,serif;letter-spacing:.06em;color:var(--gild)}
.menu button:hover{border-color:var(--gild);background:#51221b;transform:translateY(-1px);box-shadow:inset 0 0 0 2px #29100f,0 0 14px #e89e5444}
.portrait{background:#0c151a;box-shadow:inset 0 0 15px #000,0 0 0 2px #130c09;isolation:isolate}
.portrait .portrait-picture img{object-position:center center}
.dialogue{background:radial-gradient(ellipse at 100% 12%,#4b19132c,transparent 55%),linear-gradient(145deg,#180c0e,#07080a 80%);border:1px solid var(--edgebright);box-shadow:inset 0 0 0 2px #0a0809,inset 0 0 32px #0006}
.dialogue .room{font-family:Georgia,serif;color:var(--ivory);text-shadow:0 2px 3px #000}
.dialogue .stats{color:#be9e76;border-bottom-color:var(--edgebright)}
.dialogue .narration{color:#e3d3b7}.dialogue footer{color:#c1a47e}
.inventory{min-height:240px}.slot{aspect-ratio:1/1;min-height:0!important;background:radial-gradient(ellipse at 45% 28%,#3c2520,#110b0b 82%);box-shadow:inset 0 0 0 1px #9b704040,inset 0 4px 13px #0009;transition:transform .2s,border-color .2s,box-shadow .2s}.slots{grid-template-rows:repeat(2,minmax(0,1fr));align-content:start}.slot:hover{transform:translateY(-2px);box-shadow:0 0 10px #d7a7616b,inset 0 0 12px #d7a76130}.slot.occupied{background:radial-gradient(ellipse at 45% 28%,#4d3323,#140b0b 82%)}
.sectiontitle{font:16px Georgia,serif;color:var(--gild);letter-spacing:.18em;text-shadow:0 2px 2px #000}
.evidence{cursor:pointer}.polaroid,.mapcard{transition:transform .2s}.polaroid:hover{transform:rotate(-2deg) scale(1.03)}.mapcard:hover{transform:rotate(3deg) scale(1.03)}
.character:hover{transform:translateY(-3px);filter:brightness(1.14)}.character{transition:transform .2s,filter .2s}.meter strong{color:var(--ivory)}
.modalback{background:rgba(2,3,5,.82);backdrop-filter:blur(9px) brightness(.72);z-index:110;overflow:auto;padding:22px 18px;align-items:center}
.modal{position:relative;isolation:isolate;width:min(1050px,100%);max-height:min(91dvh,980px);overflow:auto;padding:34px 42px 30px;border:2px solid var(--gild);border-radius:15px;background:radial-gradient(ellipse at 50% -15%,#70301b4f,transparent 53%),radial-gradient(ellipse at 2% 88%,#641e2230,transparent 45%),repeating-linear-gradient(35deg,#120909 0,#120909 4px,#1b0d0f 5px,#120a0b 7px);box-shadow:0 0 0 2px #24130d,0 0 0 5px #644322,0 30px 90px #000, inset 0 0 0 2px #39200f,inset 0 0 42px #000b;scrollbar-color:var(--edgebright) #130b0a;scrollbar-width:thin;animation:modalAppear .28s ease both}
.modal:before,.modal:after{font-size:35px;color:var(--gild);text-shadow:0 0 10px #a36a3f}
@keyframes modalAppear{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-heading{text-align:center;margin:0 0 21px}.modal-heading h2{font:400 clamp(29px,3.2vw,52px)/1.2 Georgia,serif;letter-spacing:.02em;margin:0;color:var(--ivory);text-shadow:0 3px 3px #000,0 0 22px #a3693a46}
.modal-heading .crest{font-size:24px;color:var(--gild);line-height:1.1}.modal-heading p{font:italic clamp(13px,1.5vw,19px) Georgia,serif;color:#d5b68e;margin:9px auto 0;max-width:950px;line-height:1.4}
.heading-rule{display:flex;align-items:center;gap:13px;justify-content:center;color:var(--gild);margin:13px auto 0;width:82%;font-size:18px}.heading-rule:before,.heading-rule:after{content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,#a57647 55%,#e4b77d)}.heading-rule:after{transform:rotate(180deg)}
.modal .primary.royal{background:linear-gradient(#76302d,#3f1015);color:#f7ddb6;border:1px solid #e5b475;box-shadow:0 0 0 3px #381b16,inset 0 2px 0 #aa6152,0 5px 19px #000b;padding:12px 30px;min-height:48px;border-radius:7px;font-size:19px;font-weight:600;white-space:normal;transition:filter .18s,transform .18s}
.modal .primary.royal:hover{filter:brightness(1.3);transform:translateY(-2px)}
.modal .choice{border:1px solid #9e7043;color:#e6cfac;background:linear-gradient(#291916,#160e0d);border-radius:6px;padding:11px 20px}.modal .choice:hover{border-color:#f4c18b;background:#43211b}
.modal-actions{text-align:center;margin:18px auto 0}.modal-actions .primary{margin:0 auto}.modal-center{text-align:center}.start-label{text-align:center;color:var(--gild);letter-spacing:.2em;font-size:12px;margin:13px 0 5px}
.modal-start{width:min(1150px,100%)}.modal-start .pickcast{grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}.modal-start .pickcast button{min-width:0;background:linear-gradient(#1c1413,#08090c);color:#f0d6a5;overflow:hidden}.modal-start .pickcast button.chosen{border:2px solid #f2b76b;box-shadow:0 0 17px #e8694850}.modal-start .pickcast img{height:135px;object-fit:cover;display:block}.modal-start .pickcast span{display:block;padding:5px}
.modal-map{width:min(1490px,98vw);max-height:96dvh;padding:26px 32px 20px}.modal-map .modal-heading{margin-bottom:10px}.modal-map .modal-heading h2{font-size:clamp(32px,3.2vw,51px)}
.map-interface{display:grid;grid-template-columns:minmax(0,1fr) 244px;gap:18px;align-items:stretch}.map-paper{border:2px solid #a16a3c;border-radius:9px;padding:9px;background:radial-gradient(ellipse at 50% 30%,#583723 0%,#34201d 65%,#180e10 100%);box-shadow:inset 0 0 35px #000b;overflow:hidden}

.enhanced-dialogue{align-items:center;gap:22px}

/* Noite no Casarão 5.2 — sistema cinematográfico de painéis reais e responsivos */
:root{--metal:#bf8548;--metal-hi:#f3c98c;--metal-dim:#7e4528;--blood:#ae282b;--panel-deep:#110b0b;--text-cream:#f1ddba;--glow-gold:rgba(224,146,67,.32)}
body[data-visual="gothic"]{--metal:#c9924c;--metal-hi:#ffe0a0;--metal-dim:#713c26;--blood:#ca332e;--panel-deep:#16090b;--text-cream:#f1ddba;--glow-gold:rgba(225,117,51,.32)}
body[data-visual="steel"]{--metal:#809cb2;--metal-hi:#d2e2eb;--metal-dim:#395266;--blood:#a63b44;--panel-deep:#08111b;--text-cream:#d5e4ed;--glow-gold:rgba(116,176,213,.24)}
body[data-visual="noir"]{--metal:#c39b65;--metal-hi:#ffdfaa;--metal-dim:#755238;--blood:#9b3330;--panel-deep:#160d0b;--text-cream:#f2dfbd;--glow-gold:rgba(196,137,65,.21)}
body[data-visual="violet"]{--metal:#a18bb5;--metal-hi:#e9d4f3;--metal-dim:#493353;--blood:#b34e79;--panel-deep:#120b19;--text-cream:#e5d6ec;--glow-gold:rgba(162,105,204,.24)}
body{background:#03050a;color:var(--text-cream);overflow-x:hidden}
body::before{background:radial-gradient(ellipse 95% 85% at 52% 45%,transparent 15%,#0007 85%),linear-gradient(180deg,transparent 66%,#0b050b91 100%);z-index:0}
#scene{z-index:-1}
.game{width:100%;max-width:1730px;min-height:100dvh;margin:0 auto;padding:12px clamp(12px,1.5vw,26px) 22px;gap:11px;display:flex;flex-direction:column}
.mast{height:122px;min-height:106px;flex:none;align-items:flex-start;padding:13px 8px 3px 8px;position:relative}
.mast>div:first-child{position:relative;padding:4px 18px 5px 15px;background:linear-gradient(90deg,rgba(1,4,9,.64),rgba(1,4,9,.13) 85%,transparent)}
.mast>div:first-child:before,.mast>div:first-child:after{content:'❧ ─── ✦ ─── ❧';font-size:13px;color:var(--metal);display:block;text-align:center;text-shadow:0 1px 4px #000;letter-spacing:.18em;opacity:.85}
.mast>div:first-child:after{margin-top:1px}
.brand{font:normal clamp(29px,3.2vw,52px)/1.02 Georgia,'Times New Roman',serif;letter-spacing:.07em;white-space:nowrap;color:var(--metal-hi);text-shadow:0 2px #140b08,1px 3px 3px #050101,0 0 24px #a14a2760}
.subtitle{margin:6px auto 0;text-align:center;color:#cfb083;letter-spacing:.32em;font-size:clamp(7px,.67vw,10px);text-shadow:0 1px 4px #000}
.weather{margin-top:18px;border:1px solid #9e5d36;border-radius:18px;padding:11px 23px;background:linear-gradient(#1e0d12ef,#09070aeb);color:#e3c591;box-shadow:inset 0 0 0 1px #2b1818,0 8px 20px #000b;font:13px Georgia,serif;white-space:nowrap}
.layout{grid-template-columns:clamp(90px,9.7vw,151px) minmax(0,1.84fr) minmax(295px,.92fr);gap:12px;min-height:440px;flex:1;align-items:stretch}
.frame{position:relative;isolation:isolate;border:2px solid var(--metal);border-radius:9px;background:radial-gradient(ellipse at 32% 18%,#381d1ac7,transparent 67%),linear-gradient(137deg,#1b0e11fa,#100a0dfb 61%,#211015f7);box-shadow:inset 0 0 0 2px #090709,inset 0 0 0 4px #9a673f,inset 0 0 0 6px #140c0a,0 0 0 1px #21130f,0 10px 33px #000c,0 0 16px #090000ad;}
.frame:before,.frame:after{content:'❦';z-index:3;color:var(--metal-hi);text-shadow:1px 1px 1px #000,0 0 9px var(--glow-gold);font-size:27px;line-height:1;pointer-events:none;opacity:.9}
.frame:before{top:5px;left:6px}.frame:after{right:7px;bottom:5px}
.menu{display:flex;flex-direction:column;gap:10px;padding:10px;min-width:0}
.menu button{position:relative;flex:1;min-height:65px;height:auto!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;border:1px solid var(--metal);border-radius:6px;background:radial-gradient(ellipse at 50% 12%,#5c2a22 0%,#260e11 41%,#100b0d 100%);box-shadow:inset 0 0 0 1px #21100e,inset 0 0 0 3px #6c3f2a,0 4px 10px #000a;transition:background .2s,filter .2s,transform .2s,box-shadow .2s}
.menu button:before{content:'';position:absolute;inset:3px;border:1px solid #a5653d66;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);pointer-events:none}
.menu button:focus-visible,.menu button:hover{transform:translateX(2px);background:radial-gradient(ellipse at 50% 12%,#893b2b,#421419 45%,#19090d);box-shadow:inset 0 0 0 1px #391811,0 0 15px #c43e2670,0 3px 9px #000d}
.menu .menu-ico{font-family:Georgia,serif;font-size:clamp(25px,3vw,42px);color:var(--metal-hi);line-height:1;filter:drop-shadow(0 2px 3px #000);text-shadow:0 0 13px #f6a55b4a}
.menu .menu-name{font-family:Georgia,serif;color:var(--text-cream);letter-spacing:.05em;font-size:clamp(10px,1vw,16px);text-shadow:0 2px 3px #000;text-transform:uppercase}
.center{grid-template-columns:minmax(155px,35%) minmax(0,1fr);gap:9px;padding:9px;min-height:440px}
.portrait{border-color:var(--metal);border-radius:6px;background:radial-gradient(ellipse at 45% 50%,#29323b 0%,#111b20 39%,#080a0e 78%);box-shadow:inset 0 0 25px #0009,inset 0 0 0 2px #3d2618,0 0 0 2px #110b09;overflow:hidden}
.portrait .portrait-backdrop{inset:-13%;width:126%;height:126%;filter:blur(18px) brightness(.38) saturate(1.05);opacity:.92}

.portrait .portrait-fade{background:linear-gradient(180deg,#080707bf 0%,transparent 21%,transparent 76%,#030405cf 100%),radial-gradient(ellipse at center,transparent 41%,#050609a3 100%)}
.portrait:after{border-color:#ae895368;box-shadow:inset 0 0 60px #000a,0 0 0 7px #0004}
.portrait .portrait-finial{color:var(--metal-hi);opacity:.7}
.dialogue{border:1px solid #8b5d38;border-radius:4px;padding:clamp(11px,1.4vw,22px);background:radial-gradient(ellipse at 25% 20%,#40161833,transparent 75%),repeating-linear-gradient(19deg,transparent 0 28px,#8d543408 29px 30px),linear-gradient(155deg,#1b0c10f5,#10090bed 60%,#27100ff8);box-shadow:inset 0 0 0 1px #1f0b0b,inset 0 0 45px #0009;position:relative;overflow:hidden}
.dialogue:before{content:'❦';position:absolute;right:7px;top:3px;color:var(--metal-dim);opacity:.6;font-size:22px}
.dialogue:after{content:'';position:absolute;right:-50px;bottom:-50px;width:190px;height:190px;background:radial-gradient(ellipse,#73181b30,transparent 65%);pointer-events:none}
.room{font:normal clamp(25px,2.4vw,44px) Georgia,serif;color:var(--metal-hi);text-shadow:0 2px 3px #000,0 0 12px var(--glow-gold);line-height:1.14}
.stats{font:clamp(11px,.9vw,15px)/1.4 Georgia,serif;color:#e2bb84;padding:8px 0 13px;margin:0 0 13px;border-bottom:1px solid #a77848;position:relative}
.stats:after{content:'❧────✦────❧';position:absolute;right:5px;bottom:-9px;color:var(--metal-hi);font-size:11px;background:#16090b;padding:0 8px}
.narration{font:clamp(15px,1.17vw,20px)/1.48 Georgia,serif;color:#f4e3ca;text-shadow:0 1px #0009;scrollbar-width:thin;scrollbar-color:var(--metal) #1b0d0d;padding-right:8px}
.narration p{margin:0 0 13px}.narration p:first-child{margin-top:3px}
.dialogue footer{font:italic clamp(10px,.85vw,14px) Georgia,serif;color:#d3a877;padding:12px 0 1px;border-top:1px solid #8b5935;position:relative;z-index:2}
.right{gap:10px;min-height:0}
.evidence{height:39%;min-height:175px;padding:17px 21px;gap:7px;background:linear-gradient(138deg,#24120f,#100b0a 75%)}
.evidence:before{top:5px;left:7px}
.polaroid{transform:rotate(-6deg) translateY(3px);border:7px solid #dec5a0;border-bottom-width:19px;padding:3px;cursor:pointer;transition:transform .2s,filter .2s;box-shadow:0 7px 14px #000e,0 0 0 1px #3d261e;}
.mapcard{transform:rotate(7deg) translateY(1px);padding:5px;border:4px solid #b08b5d;cursor:pointer;transition:transform .2s,filter .2s;box-shadow:0 7px 14px #000e}
.polaroid:hover{transform:rotate(-2deg) scale(1.02);filter:brightness(1.16)}.mapcard:hover{transform:rotate(2deg) scale(1.02);filter:brightness(1.16)}
.inventory{min-height:0;padding:13px 13px 15px;background:radial-gradient(circle at 50% 0,#40211b63,transparent 68%),linear-gradient(#1b0f0cf7,#090709fa)}
.sectiontitle{font:normal clamp(14px,1.2vw,20px) Georgia,serif;color:var(--metal-hi);letter-spacing:.19em;text-align:center;margin:2px 0 9px;padding-bottom:5px;border-bottom:1px solid #9a6937;text-shadow:0 1px 4px #000,0 0 12px #d4774c40}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:7px;min-height:0;flex:1;align-content:center}
.slot{border-radius:5px;aspect-ratio:1 / 1;max-height:100%;align-self:center;justify-self:stretch;min-height:0!important;border:1px solid #b07a47;background:radial-gradient(ellipse at 50% 42%,#3b2720,#0f090b 78%);box-shadow:inset 0 0 0 2px #0d0807,inset 0 0 0 3px #76412280,inset 0 10px 24px #0005;transition:box-shadow .15s,border-color .15s,transform .15s;color:#d6b68b;cursor:pointer;position:relative;overflow:hidden}
.slot::after{content:'✦';position:absolute;left:50%;top:8%;transform:translateX(-50%);font-size:9px;color:var(--metal-dim);opacity:.75}
.slot .symbol{font:clamp(20px,2.3vw,38px) 'Segoe UI Emoji',sans-serif;filter:drop-shadow(0 3px 3px #000);z-index:1}
.slot span:last-child{z-index:1;font:clamp(8px,.67vw,11px)/1.1 Georgia,serif;color:#e6c8a3}
.slot:not(.occupied) .symbol{opacity:.6;color:var(--metal-hi)}
.slot:hover{border-color:var(--metal-hi);transform:translateY(-2px);box-shadow:0 0 16px #f1a14a50,inset 0 0 0 2px #0d0807,inset 0 0 0 3px #aa6a40}
.bottom{margin-left:calc(clamp(90px,9.7vw,151px) + 12px);grid-template-columns:minmax(0,1.84fr) minmax(295px,.92fr);gap:12px;height:154px;min-height:140px;flex:none}
.cast{gap:5px;padding:7px;align-items:stretch}
.character{border:1px solid #b2834d;border-radius:5px;background:#0b1216;box-shadow:inset 0 0 0 1px #000;transition:border-color .18s,box-shadow .18s;cursor:pointer}
.character img{width:100%;height:100%;display:block;object-fit:cover;object-position:center 29%;filter:saturate(.9)}
.character span{font:12px Georgia,serif;color:#f3debc;background:linear-gradient(transparent,#120908fa 60%);padding:12px 1px 2px;z-index:2;text-shadow:0 2px 3px #000}
.character.selected{border:2px solid #fa6d4e;box-shadow:0 0 0 1px #681c1e,0 0 20px #dd423d96,inset 0 0 20px #6a1515}
.character:hover:not(.dead){box-shadow:0 0 13px #c78b4b88;border-color:var(--metal-hi)}
.character.dead img{filter:grayscale(1) brightness(.37)}
.character.dead:after{font-size:clamp(40px,4.2vw,72px);color:#ee3036;z-index:2}
.meters{gap:9px;padding:9px;min-width:0;background:linear-gradient(160deg,#260e11,#0c090b 70%)}
.meter{min-width:0;border-color:#88603d;background:radial-gradient(ellipse at 25% 10%,#38191a,#120b0d 75%);border-radius:6px;gap:14px;padding:8px;box-shadow:inset 0 0 0 2px #11090a}
.meter strong{white-space:nowrap;font:clamp(12px,1.06vw,18px) Georgia,serif;color:#f1d4a9;text-shadow:0 1px 3px #000}
.segments{height:21px;gap:3px}.segments i{background:linear-gradient(#ce5551,#9e1c25);border:1px solid #6a2024;box-shadow:inset 0 1px 1px #f5ac9f66,0 1px 2px #0008}.segments.time i{background:linear-gradient(#ffdd93,#bb8342);border-color:#77522d;box-shadow:inset 0 1px 1px #fff3c266,0 1px 2px #0008}
/* Ornate inner corners for all primary frames — real CSS, never a flattened screenshot */
.menu,.center,.evidence,.inventory,.cast,.meters{outline:1px solid #32190d;outline-offset:-9px}
.menu:after,.center:after,.evidence:after,.inventory:after,.cast:after,.meters:after{filter:drop-shadow(0 0 4px #e5a25250)}
/* Themed layouts retain identical geometry. */
body[data-visual="steel"] .frame{background:linear-gradient(145deg,#13212ced,#070b12fa 70%,#101c26f7)}
body[data-visual="steel"] .dialogue{background:linear-gradient(145deg,#0d1721ed,#08101b 72%,#0a151d)}
body[data-visual="violet"] .frame{background:linear-gradient(145deg,#1c1027ee,#0b0b14fa 65%,#160c20f7)}
body[data-visual="violet"] .dialogue{background:linear-gradient(145deg,#1b1023ee,#0c0814 72%,#170d22)}
body[data-visual="noir"] .dialogue{background:linear-gradient(140deg,#21120de6,#100b0b 67%,#291913ee)}
/* Narrow screens: no overlapping fixed-position hotspots. */

@media(max-width:880px){.mast{height:112px}.layout{grid-template-columns:75px minmax(0,1fr);gap:9px}.menu{grid-row:1 / span 2}.center{grid-column:2;min-height:420px}.right{grid-column:2;display:grid;grid-template-columns:.8fr 1fr;gap:9px;min-height:250px}.evidence{height:100%;min-height:240px}.inventory{height:100%;min-height:240px}.bottom{margin-left:84px;grid-template-columns:1fr;height:auto}.cast{height:130px}.meters{min-height:116px}.menu button{max-height:130px}}
@media(max-width:590px){.game{padding:7px;gap:7px}.mast{height:100px;padding:4px}.mast>div:first-child{padding:2px}.mast>div:first-child:before,.mast>div:first-child:after{font-size:9px}.brand{white-space:normal;font-size:clamp(23px,6vw,35px)}.subtitle{font-size:7px;letter-spacing:.12em}.weather{display:none}.layout{grid-template-columns:55px minmax(0,1fr);gap:6px}.menu{padding:4px;gap:5px}.menu button{min-height:49px}.menu .menu-name{font-size:8px}.menu .menu-ico{font-size:22px}.center{grid-column:2;grid-template-columns:35% minmax(0,1fr);min-height:385px;padding:6px;gap:6px}.dialogue{padding:10px 8px}.room{font-size:22px}.stats{font-size:10px;padding:6px 0 9px;margin-bottom:7px}.narration{font-size:13px;line-height:1.38}.dialogue footer{font-size:9px}.right{display:grid;grid-template-columns:1fr;grid-column:2}.evidence{min-height:160px;height:170px}.inventory{height:255px}.slots{grid-template-rows:repeat(2,minmax(0,1fr))}.slot{aspect-ratio:1}.bottom{margin-left:61px;gap:6px}.cast{grid-template-columns:repeat(8,minmax(70px,1fr));height:125px;overflow-x:auto}.meters{height:107px}.meter strong{font-size:12px}}
@media(prefers-reduced-motion:reduce){.slot,.menu button,.character,.polaroid,.mapcard{transition:none!important}}

.menu-svg{width:clamp(27px,3vw,44px);height:clamp(27px,3vw,44px);display:block;color:var(--metal-hi);filter:drop-shadow(0 2px 3px #000)}

 .portrait{min-height:202px!important;height:202px!important;flex:none}

/* Regras 5.3: elementos discretos integrados ao estilo cinematográfico existente */
.prologue-story{max-width:780px;margin:14px auto 20px;padding:18px 24px;border:1px solid #aa794d;border-radius:9px;background:linear-gradient(130deg,#2c1b18d4,#0d0c10dd);color:#f0ddc0;font:clamp(17px,1.5vw,22px)/1.6 Georgia,serif}
.prologue-story p{margin:10px 0 18px}.prologue-story strong{color:#ffcc86}.prologue-story em{color:#e6b77b}
.investigation-rule{padding:15px 18px;margin:22px auto 10px;max-width:900px;border:1px solid #9b7045;border-radius:6px;background:#2e1918;color:#eccca5;font:italic 16px/1.5 Georgia,serif}
.diary-proof{max-width:740px;margin:auto;background:linear-gradient(145deg,#d1b483,#96704b);color:#2d1b13;border:7px solid #65442f;padding:22px 28px;transform:rotate(-.6deg);font:22px/1.58 Georgia,serif;box-shadow:0 10px 25px #0008}
.diary-stamp{color:#812624;font:bold 12px Georgia,serif;letter-spacing:.2em;border:2px solid #9b4238;padding:4px 9px}
.blackout-active .weather{border-color:#b94b4a;box-shadow:inset 0 0 12px #a5222550,0 0 20px #85212c45}
.modal-item .item-display p{line-height:1.55}.npc-choices button:disabled{opacity:.45;cursor:not-allowed}
.map-status{margin:12px 0;padding:10px 12px;border:1px solid #9b653f;border-radius:6px;color:#ebc894;background:#251716;font-size:14px;text-align:center}
.map-status.off{border-color:#b94942;color:#ffc4b0;background:#351a1b}
.map-utility{width:100%;padding:10px 8px;margin-top:9px;border:1px solid #ca9c65;border-radius:5px;background:#49231d;color:#f7d49c;cursor:pointer}
@media(max-width:650px){.prologue-story{padding:10px;font-size:15px}.diary-proof{padding:15px;font-size:17px}.investigation-rule{font-size:13px}}

/* 5.4: painéis de IA e salvamento em sintonia com a interface cinematográfica. */
.start-actions,.settings-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;align-items:center;margin:18px auto 4px}
.start-actions .primary,.settings-actions .primary{margin:0}
.settings-actions{border:1px solid #956b43;border-radius:9px;padding:15px;background:linear-gradient(115deg,#2a1614,#130c0e)}
.settings-actions .settings-heading{flex-basis:100%;text-align:center;color:#f6c787;font:19px Georgia,serif}
.settings-actions .choice,.start-actions .choice{min-height:44px}
.ai-config{display:grid;gap:13px;max-width:800px;margin:0 auto;color:#e8d3b4}
.ai-config label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:#ecd0a3}
.ai-config label:has(input[type=checkbox]){flex-direction:row;align-items:center;font-size:18px}
.ai-config input:not([type=checkbox]){width:100%;padding:11px 12px;background:#100c0e;color:#f4deb9;border:1px solid #a67949;border-radius:6px;font:15px Georgia,serif}
.ai-config input[type=checkbox]{width:18px;height:18px;accent-color:#a9604a}
.ai-config .primary{margin:0}.ai-config .choices{margin:6px 0}
.ai-message{padding:12px;border:1px solid #896744;background:#201313;border-radius:6px;color:#e0c49a;line-height:1.5}
.clue-atmosphere{font:italic 15px/1.4 Georgia,serif!important;color:#39271a!important;border-left:3px solid #715137;padding-left:9px}
.evidence-core{display:block;font:italic 12px/1.3 Georgia,serif;color:#d0b69b;margin-top:10px;border-top:1px solid #6f553b;padding-top:6px}
@media(max-width:570px){.start-actions,.settings-actions{flex-direction:column}.start-actions button,.settings-actions button{width:100%;white-space:normal}}

 };
 const action=item==='Adrenalina'?'Aplicar adrenalina':item==='Lanterna'?(state.flashlight?'Apagar lanterna':'Acender lanterna'):item==='Chave Mestra'&&state.room==='Biblioteca'?'Abrir cofre':item==='Caixa de Ferramentas'&&state.room==='Porão'&&state.generatorOffline?'Consertar gerador':'Inspecionar item';
 show(`${heading(esc(item))}<div class="item-display"><div class="item-icon">${itemIcons[item]||'🔎'}</div><p>${esc(descriptions[item]||'Recurso importante para sobreviver.')}</p></div><div class="choices"><button class="choice" id="use">${action}</button><button class="choice" id="drop">Largar</button><button class="choice" data-close>Cancelar</button></div>`,'item');
}
function heal(target){
 const i=Number(overlay.dataset.slot);if(state.inventory[i]!=='Kit médico')return;
 if(target==='self'){
  if(state.health===6&&!state.playerBleed)return;
  state.health=6;state.playerBleed=null;log('⚕️ Você utilizou um Kit médico. Sua hemorragia foi estancada e os ferimentos tratados.');
 }else{
  const id=Number(target);if(!alive(id)||!inRoom(id)||!state.npcBleeds[id])return;
  delete state.npcBleeds[id];state.npcHealth[id]=6;log(`⚕️ Você tratou ${names[id]}. A hemorragia foi interrompida.`);
 }
 state.inventory.splice(i,1);close();render();
}
function healSelectedNpc(){
 const id=state.selected;if(!alive(id)||!state.npcBleeds[id]||!hasItem('Kit médico'))return;
 const destination=state.npcLocations[id];state.room=destination;state.currentFloor=floorOf(destination);state.npcLocations[state.player]=destination;state.visited.add(destination);state.grouped=false;
 close();if(!advance())return;
 consumeItem('Kit médico');delete state.npcBleeds[id];state.npcHealth[id]=6;
 log(`⚕️ Você encontra ${names[id]} em ${destination} e utiliza um Kit médico para estancar a hemorragia.`);render();
 show(`${heading('Socorro prestado')}<p>${esc(names[id])} sobreviveu graças ao tratamento rápido. A equipe ganha mais tempo para descobrir o assassino.</p>${closeBtn()}`,'item');
}
function evidenceAssessment(suspect){
 const physical=state.clues.filter(text=>{const meta=state.clueMeta[text];return meta?.kind==='physical'&&meta.authentic&&meta.target===suspect}).length;
 const testimony=state.testimonies.filter(t=>t.authentic&&t.target===suspect).length;
 const diary=state.diaryRead&&suspect===state.killer;
 return {physical,testimony,diary,ready:diary||physical>=2&&testimony>=1};
}
function accusePrompt(){
 const i=state.selected;if(i===state.player||!alive(i))return;
 if(state.trustPenalty>0){
  show(`${heading('Acusação rejeitada')}<p>O grupo perdeu a confiança em você. São necessários mais <strong>${state.trustPenalty} turnos</strong> antes de uma nova acusação.</p>${closeBtn()}`,'npc');return;
 }
 const a=evidenceAssessment(i);
 show(`${heading('Confrontar suspeito')}<div class="accusation"><p>Você está prestes a acusar <strong>${esc(names[i])}</strong>.</p>
 <p>Evidências recolhidas: <strong>${state.clues.length}</strong> · Depoimentos registrados: <strong>${state.testimonies.length}</strong> · Diário consultado: <strong>${state.diaryRead?'Sim':'Não'}</strong>.</p>
 <p class="small">Compare por conta própria as descrições e os horários. O grupo só aceitará uma acusação sustentada por evidências coerentes; acusar sem provas ou a pessoa errada provoca dois turnos de desconfiança.</p>
 </div><div class="group-actions"><button class="choice" id="cancelAccuse">Voltar</button><button class="primary royal" id="confirmAccuse">Confirmar acusação</button></div>`,'npc');
}
function confirmAccuse(){
 const i=state.selected;
 if(state.trustPenalty>0||i===state.player||!alive(i))return;
 const assessment=evidenceAssessment(i);
 close();
 if(i===state.killer&&assessment.ready){
  finish(true,`Você reuniu provas materiais e relatos consistentes, confrontou ${names[i]} e expôs o verdadeiro assassino antes do amanhecer.`);return;
 }
 state.trustPenalty=2;
 log(`⚠ Você acusou ${names[i]} ${assessment.ready?'mas as evidências não eram suficientes para demonstrar sua culpa':'sem provas consistentes'}. O grupo deixou de confiar em você por dois turnos.`);
 render();
 show(`${heading('Acusação sem respaldo')}<div class="accusation"><p>${esc(names[i])} nega tudo. Os demais se afastam de você, convencidos de que está julgando sem conhecer os fatos.</p>
 <p>Durante os <strong>próximos 2 turnos</strong>, novas acusações serão rejeitadas e os sobreviventes não fornecerão informações importantes nem itens.</p>
 <p class="small">A investigação continua. Você ainda pode explorar cômodos, coletar provas e tratar ferimentos.</p></div>${closeBtn()}`,'npc');
}
function actButton(b){
 if(b.dataset.diff){state.difficulty=b.dataset.diff;startScreen()}
 else if(b.dataset.pick!==undefined){state.player=+b.dataset.pick;startScreen()}
 else if(b.id==='begin'){
  if(hasSave())show(`${heading('Iniciar uma nova noite?')}<p>Uma nova partida substituirá o salvamento automático anterior. Se quiser preservar a partida atual, use Exportar arquivo antes de começar.</p><div class="choices"><button class="primary royal" id="confirmNewGame">Iniciar nova partida</button><button class="choice" id="cancelNewGame">Voltar</button></div>`,'settings');
  else begin();
 }
 else if(b.id==='confirmNewGame')begin();
 else if(b.id==='cancelNewGame')startScreen();
 else if(b.id==='continueGame')loadGame();
 else if(b.id==='manualSave')saveGame(false);
 else if(b.id==='exportSave')exportSave();
 else if(b.id==='importSave'||b.id==='importSaveStart')$('saveImportFile')?.click();
 else if(b.id==='openAI'||b.id==='openAIStart')aiPanel();
 else if(b.id==='backSettings')state.started?configPanel():startScreen();
 
  else if(b.id==='retryAI')void retryBuiltInAI();
 else if(b.id==='prologueContinue')close();
 else if(b.dataset.panel)panel(b.dataset.panel);
 else if(b.dataset.floor!==undefined){state.currentFloor=+b.dataset.floor;mapPanel()}
 else if(b.dataset.room)explore(b.dataset.room);
 else if(b.dataset.char!==undefined)character(+b.dataset.char);
 else if(b.dataset.slot!==undefined)slot(+b.dataset.slot);
 else if(b.hasAttribute('data-close'))close();
 else if(b.dataset.topic)void talk(true,b.dataset.topic);
 else if(b.id==='privateTalk')void talk(true);
 else if(b.id==='publicTalk')void talk(false);
 else if(b.id==='accuse')accusePrompt();
 else if(b.id==='cancelAccuse')character(state.selected);
 else if(b.id==='confirmAccuse')confirmAccuse();
 else if(b.id==='repairGenerator')repairGenerator();
 else if(b.id==='searchBasement')explore('Porão','search');
 else if(b.id==='openSafe')openSafe();
 else if(b.id==='readDiary')readDiary();
 else if(b.id==='healSelectedNpc')healSelectedNpc();
 else if(b.id==='join'){
  close();if(!advance())return;
  state.groupLocation=state.room;state.grouped=true;
  for(const i of state.groupMembers){if(alive(i)){state.npcLocations[i]=state.room;delete state.separationUntil[i]}}
  log(`O grupo se reúne em ${state.room}. Estar acompanhado(a) protege melhor, mas a confiança ainda é frágil.`);render();
 }
 else if(b.dataset.heal!==undefined)heal(b.dataset.heal);
 else if(b.id==='drop'){
  const i=Number(overlay.dataset.slot);const item=state.inventory.splice(i,1)[0];
  if(item){(state.groundItems[state.room]??=[]).push(item);log(`Você deixou ${item} em ${state.room}.`)}
  if(item==='Lanterna'&&!hasItem('Lanterna'))state.flashlight=false;
  close();render();
 }
 else if(b.id==='use'){
  const item=state.inventory[Number(overlay.dataset.slot)];
  if(item==='Chave Mestra'&&state.room==='Biblioteca'){openSafe();return}
  if(item==='Caixa de Ferramentas'&&state.room==='Porão'&&state.generatorOffline){repairGenerator();return}
  close();
  if(item==='Lanterna'){state.flashlight=!state.flashlight;log(`🔦 Você ${state.flashlight?'acendeu':'apagou'} a lanterna. A carga será consumida na próxima busca no escuro ou reparo do gerador.`)}
  else if(item==='Adrenalina'){consumeItem('Adrenalina');state.adrenalineUntil=state.turn+3;log('💉 Você aplicou adrenalina. Durante os próximos três turnos, ataques contra você serão impedidos.')}
  else if(item)log(`Você inspeciona ${item}. ${item==='Pistola'?'Uma Bala é necessária para disparar.':item==='Faca'?'A faca ficará pronta para defender automaticamente a próxima emboscada.':'Guarde este recurso para uma situação adequada.'}`);
  render();
 }
 else if(b.id==='restart')location.reload();
 else if(b.dataset.toggle){let t=b.dataset.toggle;if(t==='reduced')reduced=!reduced;else state[t]=!state[t];if((t==='animated'&&state.animated)||(t==='reduced'&&!reduced))draw();if(t==='music')refreshMusic();configPanel()}
}
document.addEventListener('change',async e=>{
 if(e.target.id==='saveImportFile'){
  const f=e.target.files?.[0];if(!f)return;try{if(f.size>2500000)throw Error('Arquivo de salvamento muito grande.');const text=await f.text();loadGame(text)}catch(err){show(`${heading('Importação indisponível')}<p>${esc(err.message)}</p>${closeBtn()}`,'settings')}
 }
});
window.addEventListener('online',()=>{if(aiLoadState.phase==='failed')void retryBuiltInAI()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&aiLoadState.phase==='failed')void retryBuiltInAI()});
paint();draw();render();startScreen();updateAIWidgets();void initBuiltInAI();


</script></body></html>
